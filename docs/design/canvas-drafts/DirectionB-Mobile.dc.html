<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Baloo+2:wght@500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', 'Segoe UI', sans-serif; background: #fff9ec; color: #423a30; }
  h1, h2, h3 { font-family: 'Baloo 2', cursive; font-weight: 700; }
</style>
</helmet>

<div style="width: 390px; background: #fff9ec;">

  <div style="background: #ee9599; color: #fff; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 600;">🚚 FREE SHIPPING ACROSS INDIA</div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px;">
    <img src="logo.png" style="height: 40px; width: auto; transform: rotate(-4deg);">
    <div style="display: flex; gap: 8px;">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: #25d366; display: flex; align-items: center; justify-content: center; transform: rotate(3deg);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 11px; background: #fce4ef; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#423a30" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </div>
    </div>
  </div>

  <!-- hero: polaroid card, full photo, tilted for playfulness but not cropping content -->
  <div style="padding: 20px 24px 10px; display: flex; justify-content: center;">
    <div style="background: #fff; padding: 10px 10px 14px; border-radius: 4px; box-shadow: 0 12px 24px rgba(66,58,48,0.15); transform: rotate(-2deg); width: 100%; max-width: 320px;">
      <img src="hero1.jpg" style="width: 100%; height: 190px; object-fit: cover; object-position: center 22%; border-radius: 2px;">
    </div>
  </div>
  <div style="padding: 18px 24px 30px; text-align: center;">
    <div style="display: inline-block; background: #fff; border: 2px dashed #e91e8c; color: #e91e8c; font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;">★ handmade in jaipur</div>
    <h1 style="font-size: 27px; line-height: 1.15; color: #e91e8c; margin-bottom: 10px;">Brooches for every giggle!</h1>
    <p style="font-size: 13px; color: #6b5f52; margin-bottom: 18px;">Beaded, stitched, made with heart.</p>
    <button style="background: #e91e8c; color: #fff; border: none; padding: 13px 28px; border-radius: 999px; font-weight: 700; font-size: 14px; font-family: 'Baloo 2'; box-shadow: 0 4px 0 #a01468;">Shop Now</button>
  </div>

  <div style="padding: 30px 20px 0; text-align: center;">
    <h2 style="font-size: 22px;">Shop by Collection</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 18px 20px 0;">
    <div style="position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1/1; border: 3px solid #fff; box-shadow: 0 6px 14px rgba(66,58,48,0.12); transform: rotate(-1.5deg);">
      <img src="llama-brooch.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fce4ef; padding: 8px; text-align: center; font-family: 'Baloo 2'; font-weight: 700; color: #e91e8c; font-size: 13px;">Brooches</div>
    </div>
    <div style="position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1/1; border: 3px solid #fff; box-shadow: 0 6px 14px rgba(66,58,48,0.12); transform: rotate(1.5deg);">
      <img src="bird-hairclip.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fce4ef; padding: 8px; text-align: center; font-family: 'Baloo 2'; font-weight: 700; color: #e91e8c; font-size: 13px;">Hairclips</div>
    </div>
  </div>

  <div style="padding: 34px 20px 0; text-align: center;">
    <h2 style="font-size: 22px;">Shop the Latest</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 18px 20px 40px;">
    <div style="border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 6px 14px rgba(66,58,48,0.1);">
      <img src="llama-brooch.jpg" style="width: 100%; aspect-ratio: 1/1; object-fit: cover;">
      <div style="padding: 11px;">
        <h3 style="font-size: 13px; font-weight: 600; font-family: 'Baloo 2'; margin-bottom: 4px; color: #423a30; min-height: 2.2em;">Llama Brooch</h3>
        <div style="color: #e91e8c; font-weight: 700; font-size: 14px; margin-bottom: 8px; font-family: 'Baloo 2';">₹849</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="background: #25d366; color: #fff; border-radius: 10px; padding: 7px; text-align: center; font-size: 11px; font-weight: 700;">WhatsApp</div>
          <div style="background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af); color: #fff; border-radius: 10px; padding: 7px; text-align: center; font-size: 11px; font-weight: 700;">DM us</div>
        </div>
      </div>
    </div>
    <div style="border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 6px 14px rgba(66,58,48,0.1);">
      <img src="bird-brooch.jpg" style="width: 100%; aspect-ratio: 1/1; object-fit: cover;">
      <div style="padding: 11px;">
        <h3 style="font-size: 13px; font-weight: 600; font-family: 'Baloo 2'; margin-bottom: 4px; color: #423a30; min-height: 2.2em;">Bird Brooch</h3>
        <div style="color: #e91e8c; font-weight: 700; font-size: 14px; margin-bottom: 8px; font-family: 'Baloo 2';">₹549</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="background: #25d366; color: #fff; border-radius: 10px; padding: 7px; text-align: center; font-size: 11px; font-weight: 700;">WhatsApp</div>
          <div style="background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af); color: #fff; border-radius: 10px; padding: 7px; text-align: center; font-size: 11px; font-weight: 700;">DM us</div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
