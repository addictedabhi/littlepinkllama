<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', 'Segoe UI', sans-serif; background: #fff; color: #2d2a2e; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
</style>
</helmet>

<div style="width: 390px; background: #fffaf7;">

  <div style="background: #ee9599; color: #fff; text-align: center; padding: 8px 0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;">FREE SHIPPING ACROSS INDIA</div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #f6e2d8;">
    <img src="logo.png" style="height: 36px; width: auto;">
    <div style="display: flex; gap: 10px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 8px; background: #fce4ef; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4145" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </div>
    </div>
  </div>

  <!-- hero: 4:3 crop, full photo visible, caption below not overlaid -->
  <div style="width: 390px; height: 292px; overflow: hidden;">
    <img src="hero1.jpg" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%;">
  </div>
  <div style="background: #fce4ef; padding: 28px 24px 32px; text-align: center;">
    <div style="display: inline-block; background: #fff; color: #c2185b; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;">HANDMADE WITH LOVE</div>
    <h1 style="font-size: 28px; line-height: 1.15; color: #c2185b; margin-bottom: 10px;">Brooches for every giggle</h1>
    <p style="font-size: 14px; color: #5a4f52; margin-bottom: 20px;">Twirl-worthy handcrafted accessories, made in Jaipur.</p>
    <button style="background: #e91e8c; color: #fff; border: none; padding: 13px 30px; border-radius: 999px; font-weight: 600; font-size: 14px;">Shop the Collection →</button>
  </div>

  <div style="padding: 36px 20px 0; text-align: center;">
    <h2 style="font-size: 24px;">Shop by Collection</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 20px 20px 0;">
    <div style="position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1.05;">
      <img src="llama-brooch.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(45,20,30,0.65));"></div>
      <div style="position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 15px; font-weight: 600; font-family: 'Fraunces', serif;">Brooches</div>
    </div>
    <div style="position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1.05;">
      <img src="bird-hairclip.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(45,20,30,0.65));"></div>
      <div style="position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 15px; font-weight: 600; font-family: 'Fraunces', serif;">Hairclips</div>
    </div>
  </div>

  <div style="padding: 40px 20px 0; text-align: center;">
    <h2 style="font-size: 24px;">Shop the Latest</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 20px 20px 40px;">
    <div style="border: 1px solid #f6e2d8; border-radius: 14px; overflow: hidden; background: #fff;">
      <img src="llama-brooch.jpg" style="width: 100%; aspect-ratio: 1/1; object-fit: cover;">
      <div style="padding: 12px;">
        <h3 style="font-size: 13px; font-weight: 500; font-family: 'Jost'; margin-bottom: 4px; min-height: 2.4em;">Llama - Brooch</h3>
        <div style="color: #c2185b; font-weight: 600; font-size: 14px; margin-bottom: 8px;">Rs. 849</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="background: #25d366; color: #fff; border-radius: 999px; padding: 7px; text-align: center; font-size: 11px; font-weight: 600;">WhatsApp</div>
          <div style="background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af); color: #fff; border-radius: 999px; padding: 7px; text-align: center; font-size: 11px; font-weight: 600;">DM us</div>
        </div>
      </div>
    </div>
    <div style="border: 1px solid #f6e2d8; border-radius: 14px; overflow: hidden; background: #fff;">
      <img src="bird-brooch.jpg" style="width: 100%; aspect-ratio: 1/1; object-fit: cover;">
      <div style="padding: 12px;">
        <h3 style="font-size: 13px; font-weight: 500; font-family: 'Jost'; margin-bottom: 4px; min-height: 2.4em;">Bird - Brooch</h3>
        <div style="color: #c2185b; font-weight: 600; font-size: 14px; margin-bottom: 8px;">Rs. 549</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="background: #25d366; color: #fff; border-radius: 999px; padding: 7px; text-align: center; font-size: 11px; font-weight: 600;">WhatsApp</div>
          <div style="background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af); color: #fff; border-radius: 999px; padding: 7px; text-align: center; font-size: 11px; font-weight: 600;">DM us</div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
