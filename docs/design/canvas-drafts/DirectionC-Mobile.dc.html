<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', 'Segoe UI', sans-serif; background: #fbf3ec; color: #3a1220; }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }
</style>
</helmet>

<div style="width: 390px; background: #fbf3ec;">

  <div style="background: #3a1220; color: #f3d9c4; text-align: center; padding: 8px 0; font-size: 10px; font-weight: 500; letter-spacing: 0.1em;">FREE SHIPPING ACROSS INDIA</div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
    <img src="logo.png" style="height: 34px; width: auto;">
    <div style="display: flex; gap: 16px; align-items: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3a1220" stroke-width="1.6"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a1220" stroke-width="1.6"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
  </div>

  <!-- hero: image first (full width, generous height), text below on cream — nothing overlaid/cropped -->
  <div style="width: 390px; height: 340px; overflow: hidden;">
    <img src="hero1.jpg" style="width: 100%; height: 100%; object-fit: cover; object-position: center 25%;">
  </div>
  <div style="padding: 30px 24px 34px;">
    <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7d1338; margin-bottom: 14px; display: block; font-weight: 500;">The Little Pink Llama Edit</span>
    <h1 style="font-size: 30px; line-height: 1.15; color: #3a1220; margin-bottom: 14px;">Brooches for <em style="font-style: italic; color: #7d1338;">every giggle</em></h1>
    <p style="font-size: 14px; color: #5c3d3f; margin-bottom: 22px; line-height: 1.6;">Hand-beaded and stitched in Jaipur — made to be treasured.</p>
    <button style="background: #3a1220; color: #f3d9c4; border: none; padding: 14px 30px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; width: 100%;">Shop the Edit</button>
  </div>

  <div style="padding: 8px 24px 0;">
    <h2 style="font-size: 23px; margin-bottom: 20px;">Shop by Collection</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: #3a1220; margin: 0 20px;">
    <div style="position: relative; overflow: hidden; aspect-ratio: 1/1.1;">
      <img src="llama-brooch.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; inset: 0; background: linear-gradient(transparent 60%, rgba(58,18,32,0.75));"></div>
      <div style="position: absolute; left: 14px; bottom: 14px; color: #f3d9c4; font-size: 15px; font-family: 'Playfair Display', serif; font-weight: 600;">Brooches</div>
    </div>
    <div style="position: relative; overflow: hidden; aspect-ratio: 1/1.1;">
      <img src="bird-hairclip.jpg" style="width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; inset: 0; background: linear-gradient(transparent 60%, rgba(58,18,32,0.75));"></div>
      <div style="position: absolute; left: 14px; bottom: 14px; color: #f3d9c4; font-size: 15px; font-family: 'Playfair Display', serif; font-weight: 600;">Hairclips</div>
    </div>
  </div>

  <div style="padding: 34px 24px 0;">
    <h2 style="font-size: 23px; margin-bottom: 20px;">Shop the Latest</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 0 24px 40px;">
    <div>
      <div style="overflow: hidden; margin-bottom: 12px;"><img src="llama-brooch.jpg" style="width: 100%; aspect-ratio: 1/1.05; object-fit: cover;"></div>
      <h3 style="font-size: 13px; font-weight: 500; font-family: 'Jost'; margin-bottom: 4px; color: #3a1220; min-height: 2.2em;">Llama — Brooch</h3>
      <div style="color: #7d1338; font-weight: 500; font-size: 13px; margin-bottom: 10px;">Rs. 849</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="border: 1px solid #3a1220; color: #3a1220; padding: 7px; text-align: center; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;">WhatsApp</div>
        <div style="background: #3a1220; color: #f3d9c4; padding: 7px; text-align: center; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;">DM us</div>
      </div>
    </div>
    <div>
      <div style="overflow: hidden; margin-bottom: 12px;"><img src="bird-brooch.jpg" style="width: 100%; aspect-ratio: 1/1.05; object-fit: cover;"></div>
      <h3 style="font-size: 13px; font-weight: 500; font-family: 'Jost'; margin-bottom: 4px; color: #3a1220; min-height: 2.2em;">Bird — Brooch</h3>
      <div style="color: #7d1338; font-weight: 500; font-size: 13px; margin-bottom: 10px;">Rs. 549</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="border: 1px solid #3a1220; color: #3a1220; padding: 7px; text-align: center; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;">WhatsApp</div>
        <div style="background: #3a1220; color: #f3d9c4; padding: 7px; text-align: center; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;">DM us</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
